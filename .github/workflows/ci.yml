name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies (mbedTLS for the satellite, cryptography for ground)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libmbedtls-dev
          pip install cryptography pyyaml
      - name: Build the satellite libraries (C++)
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Werror -Isatellite/satellite_f1 \
            satellite/satellite_f1/ccsds.cpp tests/native/ccsds_cli.cpp -o build/ccsds_cli
          g++ -std=c++17 -Wall -Wextra -Werror -Isatellite/satellite_f2 \
            satellite/satellite_f2/ccsds.cpp satellite/satellite_f2/sdls.cpp \
            tests/native/sdls_cli.cpp -lmbedcrypto -o build/sdls_cli
          g++ -std=c++17 -Wall -Wextra -Werror -Isatellite/satellite_f3 \
            satellite/satellite_f3/ccsds.cpp satellite/satellite_f3/sdls.cpp satellite/satellite_f3/farm.cpp \
            tests/native/f3_cli.cpp -lmbedcrypto -o build/f3_cli
      - name: Ground and interop tests
        run: python -m unittest discover -s tests -v

  policies:
    # Phase 4: scans the SA database of the link with the ccsds-policy-as-code
    # policies and compares the result with the accepted risks register.
    runs-on: ubuntu-latest
    env:
      CONFTEST_VERSION: 0.59.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the policies (ccsds-policy-as-code repo)
        id: policies
        run: |
          if git clone --depth 1 https://github.com/jfabio-navarrom/ccsds-policy-as-code.git ../ccsds-policy-as-code; then
            echo "available=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The ccsds-policy-as-code repo is not reachable; skipping the policy scan"
            echo "available=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Conftest and PyYAML
        if: steps.policies.outputs.available == 'yes'
        run: |
          curl -sSfL -o conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tgz conftest
          sudo mv conftest /usr/local/bin/
          pip install pyyaml
      - name: Scan groundlink.sdls.yaml with the policies
        if: steps.policies.outputs.available == 'yes'
        run: python tools/check_policy.py --policies ../ccsds-policy-as-code/policy
