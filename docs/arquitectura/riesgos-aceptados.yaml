# Registro de riesgos aceptados para los hallazgos del escaneo de politicas
# (ccsds-policy-as-code) sobre groundlink.sdls.yaml.
#
# tools/check_policy.py hace fallar el CI si:
#   - aparece un hallazgo que NO esta en esta lista (desviacion nueva);
#   - una aceptacion ya no corresponde a ningun hallazgo (aceptacion caducada:
#     se corrigio el problema y hay que borrarla);
#   - una aceptacion ha pasado su fecha de revision.
#
# Cada aceptacion dice QUE se acepta, POR QUE, con QUE controles compensatorios
# y CUANDO se revisa. Es lo que pediria un auditor.

aceptaciones:
  - policy_id: SDLS-020
    objetivo: [spi=1, spi=2]
    riesgo: medio
    decision: >-
      No hay campo de numero de secuencia separado en la Security Header: el IV
      de 12 octetos (4 a cero + contador de 64 bits) hace de ARSN.
    justificacion: >-
      El IV va autenticado como AAD y el satelite exige que crezca
      estrictamente, comprobandolo despues de la MAC (ADR-009). Los ataques de
      replay de las fases 2 y 3 se rechazan, tambien tras reiniciar la placa.
    controles_compensatorios: [ADR-009, tests/test_sdls.py, tests/test_interop_f2.py, tests/test_e2e_f2.py]
    remediacion: Anadir un ARSN explicito de 4 octetos si el enlace se usa fuera del laboratorio.
    responsable: jfabio-navarrom
    revisar_antes: 2027-05-01

  - policy_id: SDLS-021
    objetivo: [spi=1, spi=2]
    riesgo: bajo
    decision: >-
      Sin ventana anti-replay: se acepta cualquier IV mayor que el ultimo.
    justificacion: >-
      El contador de IV de tierra se basa en el reloj en microsegundos
      (sobrevive a perder el estado), lo que produce saltos grandes e
      incompatibles con una ventana estrecha. Un atacante sin clave no puede
      mover el contador porque la MAC se verifica antes (ataque 'forge').
    controles_compensatorios: [ADR-009, ADR-011, tests/test_e2e_f2.py]
    remediacion: Si se anade ARSN explicito, usar un contador secuencial con ventana <= 16.
    responsable: jfabio-navarrom
    revisar_antes: 2027-05-01

  - policy_id: MISSION-002
    objetivo: [spi=1, spi=2]
    riesgo: alto
    decision: >-
      Las claves no estan en un KMS/HSM: en tierra viven en un archivo JSON
      local y a bordo en la flash del ESP32 sin cifrar.
    justificacion: >-
      Laboratorio de una sola placa sin HSM. Los archivos de claves estan
      excluidos de Git y la rotacion en vuelo (OTAR) permite revocar una clave
      filtrada sin reflashear.
    controles_compensatorios: [ADR-010, .gitignore, tests/test_e2e_f3.py]
    remediacion: >-
      Tierra: claves en un almacen del sistema (DPAPI / keyring) o HSM.
      A bordo: activar flash encryption y secure boot del ESP32-C5.
    responsable: jfabio-navarrom
    revisar_antes: 2027-05-01
