# Security Association (SA) database of the ccsds-sdls-groundlink link,
# in the ccsds-policy-as-code format (apiVersion sdls.portfolio/v1).
#
# It describes what is IMPLEMENTED in phase 3, not the ideal. If the code
# changes, tests/test_sa_database.py fails until this file is updated.
# The deviations found by the policy scan are accepted, with a
# justification, in accepted-risks.yaml.
#
# There is no key material here: only references.

apiVersion: sdls.portfolio/v1
kind: SecurityAssociationDatabase
metadata:
  mission: GROUNDLINK-C5
  owner: jfabio-navarrom
  legacy_implementation: false

virtual_channels:
  - name: tc-commands
    protocol: TC
    gvcid: { tfvn: 0, scid: 197, vcid: 0 }   # SCID 0x0C5
    carries: telecommand
    cop: true                                # COP-1: FOP on ground, FARM-1 on board
  - name: tm-telemetry
    protocol: TM
    gvcid: { tfvn: 0, scid: 197, vcid: 0 }
    carries: telemetry
    cop: false

security_associations:
  - spi: 1
    description: Telecommands, authenticated encryption
    protocol: TC
    gvcids:
      - { tfvn: 0, scid: 197, vcid: 0 }
    service: authenticated_encryption
    algorithm: { cipher: AES, mode: GCM, key_bits: 256 }
    iv_length_octets: 12
    # The IV (64 bit counter) works as the anti-replay number: there is no
    # separate sequence field in the Security Header, and no window (any IV
    # higher than the last one is accepted). See ADR-009 and accepted-risks.yaml.
    sequence_number: { length_octets: 0, window: 0 }
    pad_length_octets: 0
    mac_length_octets: 16
    key_ref: file://ground/keys_f3.json#active.tc

  - spi: 2
    description: Telemetry, authenticated encryption
    protocol: TM
    gvcids:
      - { tfvn: 0, scid: 197, vcid: 0 }
    service: authenticated_encryption
    algorithm: { cipher: AES, mode: GCM, key_bits: 256 }
    iv_length_octets: 12
    sequence_number: { length_octets: 0, window: 0 }
    pad_length_octets: 0
    mac_length_octets: 16
    key_ref: file://ground/keys_f3.json#active.tm
